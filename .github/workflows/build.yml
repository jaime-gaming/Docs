name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el sitio
        run: npm run build

      - name: Pruebas
        run: npm test

      # Las páginas generadas no se versionan: se comprueba que el build es
      # reproducible y que el payload de Pages queda completo.
      - name: Preparar el payload de Pages
        run: node scripts/stage_site.mjs

      - name: Comprobar el payload
        run: |
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/sitemap.xml
          test -f _site/.nojekyll
          test -f _site/assets/css/style.css
          test -f _site/assets/img/icons.svg
          test -f _site/assets/data/search-index.json
          test ! -e _site/node_modules
          echo "payload correcto: $(find _site -name index.html | wc -l) páginas"

  deploy:
    name: Publicar en la rama gh-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generar y preparar el sitio
        run: npm run stage

      # Pages sirve la rama gh-pages (Settings → Pages → Deploy from a branch).
      # La rama se reescribe entera en cada publicación: es salida generada y su
      # historial no aporta nada. Solo git, sin acciones de terceros.
      - name: Publicar en gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
